services:
  postgres:
    image: postgres:16
    container_name: msi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: msi_admin
      POSTGRES_PASSWORD: dev_password_change_me
      POSTGRES_DB: msi_dev
    ports:
      - "5432:5432"
    volumes:
      - msi_pgdata:/var/lib/postgresql/data

volumes:
  msi_pgdata: